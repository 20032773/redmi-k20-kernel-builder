name: Build Redmi K20 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: LineageOS kernel branch/tag/commit
        required: true
        default: lineage-23.2
        type: string
      ksun_ref:
        description: KernelSU Next legacy branch/tag/commit (use "legacy" to test its newest commit)
        required: true
        default: fd093e8b879063aeb0192a3959b0652101ded623
        type: string
      build_dtbo:
        description: Build a separate davinci dtbo.img artifact
        required: true
        default: true
        type: boolean
      thinlto:
        description: Enable experimental Clang ThinLTO optimization
        required: true
        default: false
        type: boolean
      gaming_tweaks:
        description: Enable stable gaming optimizations (Westwood TCP, LZ4 ZRAM, Deadline I/O, disable debug logging)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: redmi-k20-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git
  KSUN_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_HOOKS_REPO: https://github.com/devnoname120/kernelsu-coccinelle.git
  KSU_HOOKS_COMMIT: 9e30076418813fc7eaab6481da2e745dfde56249
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

jobs:
  build:
    name: Build Kernel for Redmi K20 (davinci)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache coccinelle curl device-tree-compiler \
            flex git libncurses5-dev libssl-dev libxml2 lzop python3 rsync zip

      - name: Clone toolchain and kernel
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-toolchain
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_REPO" kernel-source
          {
            echo "kernel_ref=$KERNEL_REF"
            echo "kernel_commit=$(git -C kernel-source rev-parse HEAD)"
          } > build-info.txt

      - name: Integrate KernelSU Next legacy
        env:
          REQUESTED_KSUN_REF: ${{ inputs.ksun_ref }}
        run: |
          set -euxo pipefail

          KSUN_REF="$REQUESTED_KSUN_REF"
          test -n "$KSUN_REF"

          # Keep KernelSU-Next as a separate Git repository. Its Kbuild uses
          # that repository to derive the manager-compatible version number.
          git clone --branch legacy --single-branch "$KSUN_REPO" KernelSU-Next
          if ! git -C KernelSU-Next checkout --detach "$KSUN_REF"; then
            git -C KernelSU-Next fetch origin "$KSUN_REF"
            git -C KernelSU-Next checkout --detach FETCH_HEAD
          fi

          KSUN_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          KSUN_GIT_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSUN_VERSION="$((30000 + KSUN_GIT_COUNT + 200))"
          KSUN_TAG="$(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "ksun_ref=$KSUN_REF"
            echo "ksun_commit=$KSUN_COMMIT"
            echo "ksun_version=$KSUN_VERSION"
            echo "ksun_nearest_tag=${KSUN_TAG:-none}"
          } >> build-info.txt

          cd kernel-source
          ln -s ../../KernelSU-Next/kernel drivers/kernelsu

          # This vendor 4.14 tree has asm/pgtable.h but no linux/pgtable.h.
          printf '%s\n' '#include <asm/pgtable.h>' > include/linux/pgtable.h

          python3 ../patch_ksun_legacy.py

          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '%s\n' 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply KernelSU manual hooks
        run: |
          set -euxo pipefail
          cd kernel-source
          git clone "$KSU_HOOKS_REPO" kernelsu-coccinelle
          git -C kernelsu-coccinelle checkout --detach "$KSU_HOOKS_COMMIT"

          # KernelSU Next legacy no longer exports ksu_handle_devpts(). Apply
          # the remaining classic rules only; adding the obsolete devpts call
          # would survive compilation and fail later while linking vmlinux.
          SP_FILE="$(realpath kernelsu-coccinelle/classic-hooks/kernelsu.cocci)"
          HOOK_FILES="$(grep -Po 'file in "\K[^"]+' "$SP_FILE" | sort -u)"
          while IFS= read -r file; do
            if [ "$file" = 'fs/devpts/inode.c' ]; then
              continue
            fi
            spatch --very-quiet --sp-file "$SP_FILE" --in-place \
              --linux-spacing "$file" || true
          done <<< "$HOOK_FILES"
          rm -rf kernelsu-coccinelle

          python3 ../patch_manual_hooks.py

          # A manual-hook kernel must never accidentally enable a kprobe hook alias.
          test "$(grep -RIl 'KernelSU: Manual hooks are incompatible' drivers/input/input.c | wc -l)" -eq 1
          if grep -q 'ksu_handle_devpts' fs/devpts/inode.c; then
            echo 'error: obsolete KernelSU devpts hook was unexpectedly installed' >&2
            exit 1
          fi
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_vfs_read' fs/read_write.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q '^int path_umount' fs/namespace.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Configure davinci kernel
        env:
          ENABLE_THINLTO: ${{ inputs.thinlto }}
          ENABLE_GAMING_TWEAKS: ${{ inputs.gaming_tweaks }}
        run: |
          set -euxo pipefail
          cd kernel-source

          test -f "arch/arm64/configs/$DEFCONFIG"
          test -f arch/arm64/configs/vendor/davinci.config

          cat > /tmp/kernelsu-next.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          # CONFIG_CC_OPTIMIZE_FOR_SIZE is not set
          # CONFIG_KPROBES is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_HOOK_KPROBES is not set
          # CONFIG_KSU_WITH_KPROBES is not set
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          if [ "$ENABLE_THINLTO" = 'true' ]; then
            cat >> /tmp/kernelsu-next.config <<'EOF'
          # CONFIG_LTO_NONE is not set
          CONFIG_LTO_CLANG=y
          CONFIG_THINLTO=y
          EOF
          else
            cat >> /tmp/kernelsu-next.config <<'EOF'
          CONFIG_LTO_NONE=y
          # CONFIG_LTO_CLANG is not set
          # CONFIG_THINLTO is not set
          EOF
          fi

          if [ "$ENABLE_GAMING_TWEAKS" = 'true' ]; then
            cat >> /tmp/kernelsu-next.config <<'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_LZ4_COMPRESS=y
          # CONFIG_ZRAM_LZO_COMPRESS is not set
          CONFIG_DEFAULT_DEADLINE=y
          # CONFIG_DEFAULT_CFQ is not set
          CONFIG_DEFAULT_IOSCHED="deadline"
          # CONFIG_SCHED_DEBUG is not set
          EOF
          fi

          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            "arch/arm64/configs/$DEFCONFIG" \
            arch/arm64/configs/vendor/davinci.config \
            /tmp/kernelsu-next.config

          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          make O=out ARCH=arm64 CC=clang olddefconfig

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -qx '# CONFIG_KSU_DEBUG is not set' out/.config
          grep -qx 'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y' out/.config
          grep -qx '# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set' out/.config
          grep -qx 'CONFIG_MACH_XIAOMI_DAVINCI=y' out/.config
          if [ "$ENABLE_THINLTO" = 'true' ]; then
            grep -qx 'CONFIG_LTO=y' out/.config
            grep -qx 'CONFIG_LTO_CLANG=y' out/.config
            grep -qx 'CONFIG_THINLTO=y' out/.config
            grep -qx '# CONFIG_LTO_NONE is not set' out/.config
          else
            grep -qx 'CONFIG_LTO_NONE=y' out/.config
            grep -qx '# CONFIG_LTO_CLANG is not set' out/.config
            grep -qx '# CONFIG_THINLTO is not set' out/.config
          fi
          if [ "$ENABLE_GAMING_TWEAKS" = 'true' ]; then
            grep -qx 'CONFIG_TCP_CONG_ADVANCED=y' out/.config
            grep -qx 'CONFIG_TCP_CONG_WESTWOOD=y' out/.config
            grep -qx 'CONFIG_DEFAULT_WESTWOOD=y' out/.config
            grep -qx 'CONFIG_DEFAULT_TCP_CONG="westwood"' out/.config
            grep -qx 'CONFIG_ZRAM_LZ4_COMPRESS=y' out/.config
            grep -qx 'CONFIG_DEFAULT_DEADLINE=y' out/.config
            grep -qx 'CONFIG_DEFAULT_IOSCHED="deadline"' out/.config
            grep -qx '# CONFIG_SCHED_DEBUG is not set' out/.config
          fi
          echo "thinlto=$ENABLE_THINLTO" >> ../build-info.txt
          echo "gaming_tweaks=$ENABLE_GAMING_TWEAKS" >> ../build-info.txt
          if grep -Eq '^CONFIG_(KPROBES|KSU_KPROBES_HOOK|KSU_HOOK_KPROBES|KSU_WITH_KPROBES)=y$' out/.config; then
            echo 'error: a kprobe hook was enabled together with manual hooks' >&2
            exit 1
          fi

      - name: Build kernel and device trees
        env:
          BUILD_DTBO: ${{ inputs.build_dtbo }}
          ENABLE_THINLTO: ${{ inputs.thinlto }}
        run: |
          set -euxo pipefail
          cd kernel-source

          # These automotive DTBs are unrelated to davinci and are broken in this tree.
          sed -i '/sa6155/d' arch/arm64/boot/dts/qcom/Makefile

          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          # LineageOS davinci uses BOARD_KERNEL_SEPARATED_DTBO := true.
          # Keep the boot kernel and dtbo partition image separate.
          TARGETS='Image.gz'
          if [ "$BUILD_DTBO" = 'true' ]; then
            TARGETS="$TARGETS dtbs"
          fi

          LTO_MAKE_ARGS=()
          if [ "$ENABLE_THINLTO" = 'true' ]; then
            # This tree's ThinLTO cache flag is understood by ld.lld, while
            # the Proton GNU gold binary rejects --thinlto-cache-dir.
            command -v ld.lld
            ld.lld --version | head -n 1
            python3 ../patch_thinlto_kbuild.py
            grep -qF '$@.lto-prereqs' scripts/Makefile.build
            LTO_MAKE_ARGS+=(LD=ld.lld)
          fi

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${LTO_MAKE_ARGS[@]}" \
            $TARGETS 2>&1 | tee ../build.log

          test -s out/arch/arm64/boot/Image.gz

      - name: Create davinci DTBO image
        if: ${{ inputs.build_dtbo }}
        run: |
          set -euxo pipefail
          DTBO_DIR=kernel-source/out/arch/arm64/boot/dts/qcom
          DTBO_FILES=(
            "$DTBO_DIR/davinci-sdmmagpie-overlay.dtbo"
            "$DTBO_DIR/davinci_m0a-sdmmagpie-overlay.dtbo"
            "$DTBO_DIR/davinci_m0b-sdmmagpie-overlay.dtbo"
          )
          for file in "${DTBO_FILES[@]}"; do
            test -s "$file"
          done

          python3 mkdtboimg.py create dtbo-davinci.img \
            --page_size=4096 "${DTBO_FILES[@]}"
          test -s dtbo-davinci.img
          python3 mkdtboimg.py dump dtbo-davinci.img > dtbo-info.txt

      - name: Pack kernel-only AnyKernel3 ZIP
        run: |
          set -euxo pipefail
          git init AnyKernel3-base
          git -C AnyKernel3-base remote add origin "$ANYKERNEL_REPO"
          git -C AnyKernel3-base fetch --depth=1 origin "$ANYKERNEL_COMMIT"
          git -C AnyKernel3-base checkout --detach FETCH_HEAD
          test "$(git -C AnyKernel3-base rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          echo "anykernel_commit=$ANYKERNEL_COMMIT" >> build-info.txt

          cp -a AnyKernel3-base AnyKernel3-kernel-only
          rm -rf AnyKernel3-kernel-only/.git
          cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3-kernel-only/
          cp anykernel.sh AnyKernel3-kernel-only/anykernel.sh
          grep -qx 'do.modules=0' AnyKernel3-kernel-only/anykernel.sh

          # Some recoveries remain on the final Done screen when the updater
          # reaches EOF without an explicit status exit. Flush boot writes and
          # return success explicitly; never force an automatic reboot.
          UPDATER=AnyKernel3-kernel-only/META-INF/com/google/android/update-binary
          printf '\nsync;\nexit 0;\n' >> "$UPDATER"
          tail -n 2 "$UPDATER" | grep -qx 'exit 0;'

          (cd AnyKernel3-kernel-only && \
            zip -r9 ../AnyKernel3-davinci-KernelSU-Next-kernel-only.zip . \
              -x 'README.md')
          test -s AnyKernel3-davinci-KernelSU-Next-kernel-only.zip

      - name: Collect build outputs
        if: success()
        run: |
          set -euxo pipefail
          mkdir -p release
          cp AnyKernel3-davinci-KernelSU-Next-kernel-only.zip release/
          cp kernel-source/out/arch/arm64/boot/Image.gz release/
          cp kernel-source/out/.config release/kernel.config
          cp build-info.txt release/
          if [ -f dtbo-davinci.img ]; then
            cp dtbo-davinci.img dtbo-info.txt release/
          fi
          sha256sum release/* > release/SHA256SUMS

      - name: Upload flashable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: davinci-LineageOS-${{ inputs.kernel_ref }}-KernelSU-Next
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: davinci-build-failure-diagnostics
          path: |
            build.log
            build-info.txt
            kernel-source/out/.config
            kernel-source/**/*.rej
          if-no-files-found: ignore
          retention-days: 14
