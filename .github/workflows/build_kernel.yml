name: Build Redmi K20 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Redmi K20 (davinci)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libncurses5-dev libssl-dev libxml2 rsync zip lzop coccinelle

      - name: Clone Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang-toolchain

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git -b lineage-23.2 --depth=1 kernel-source

      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel-source
          # Clone SukiSU-Ultra to a temporary folder
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git -b main --depth=1 drivers/kernelsu_tmp
          # Move the actual kernel driver directory to drivers/kernelsu
          mv drivers/kernelsu_tmp/kernel drivers/kernelsu
          rm -rf drivers/kernelsu_tmp
          
          # Configure Makefile and Kconfig
          echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply KernelSU Manual Hooks (Coccinelle)
        run: |
          cd kernel-source
          git clone https://github.com/devnoname120/kernelsu-coccinelle.git --depth=1
          cd kernelsu-coccinelle/classic-hooks
          ./apply.sh ../..
          cd ../..
          rm -rf kernelsu-coccinelle

      - name: Integrate SUSFS
        run: |
          cd kernel-source
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 --depth=1
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          # Apply patch with --fuzz=0 to prevent patch from corrupting files by misapplying hunks
          patch --fuzz=0 -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          python3 ../patch_susfs_rejects.py
          rm -rf susfs4ksu

      - name: Configure defconfig
        run: |
          cd kernel-source
          # Dynamically find the sdmsteppe-perf_defconfig or fallback to any perf_defconfig
          DEFCONFIG_FILE="arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"
          if [ ! -f "$DEFCONFIG_FILE" ]; then
              DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*sdmsteppe-perf_defconfig" -print -quit)
              if [ -z "$DEFCONFIG_FILE" ]; then
                  DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*perf_defconfig" -print -quit)
              fi
          fi
          echo "Found defconfig: $DEFCONFIG_FILE"
          
          # Append SukiSU-Ultra & SUSFS configs
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_FILE"
          
          # Save the defconfig name for the build step
          DEFCONFIG_NAME=$(echo "$DEFCONFIG_FILE" | sed 's|arch/arm64/configs/||')
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
          make O=out ARCH=arm64 $DEFCONFIG_NAME
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Pack AnyKernel3 flashable ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp anykernel.sh AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../AnyKernel3-davinci-SukiSU-Ultra.zip * -x .git* README.md

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-davinci-SukiSU-Ultra
          path: AnyKernel3-davinci-SukiSU-Ultra.zip
